[project]
name = "formance-mcp"
version = "0.1.0"
description = "MCP server in front of the Formance Ledger HTTP API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=2.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "cryptography<45; platform_system == 'Darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
formance-mcp = "formance_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formance_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
